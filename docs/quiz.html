<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Viewer</title>

  <link rel="stylesheet" href="theme.css">

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Slide parser -->
  <script src="embed_slides.js" defer></script>

  <!-- Page logic -->
  <script src="quiz.js" defer></script>

  <style>
    .all-slides-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 24px;
    }

    .slide-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .slide-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border-bottom: 1px solid var(--border);
    }

    .slide-card-title {
      font-weight: 800;
      font-size: clamp(1.4rem, 2vw, 2rem);
    }

    .notes-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.10);
      border: 1px solid var(--border);
      color: white;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .notes-toggle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: white !important;   /* force white stroke */
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .notes-toggle[aria-expanded="true"] {
      background: rgba(83,136,244,0.4);
    }

    .notes-toggle[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .slide-card-body {
      padding: 0;
    }

    .slide-card .slide {
      height: auto;
      min-height: 300px;
    }

    .slide-notes {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }

    .slide-notes.show {
      display: block;
    }

    .slide-notes-empty {
      color: var(--muted);
      margin: 0;
    }

    .source-slides {
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Quiz</h1>
    </header>

    <main class="all-slides-page" id="allSlidesPage"></main>

    <div id="sourceSlides" class="source-slides"></div>
  </div>
</body>
</html>
